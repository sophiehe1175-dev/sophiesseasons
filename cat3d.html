<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The yarn chaser, in 3D · Sophie</title>
<meta name="description" content="Sophie's pouncing orange tabby and its yarn ball as a 3D model you can turn around.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,144,600,100,1;1,14,400,100,1&display=swap">
<style>
:root { --bg: #D4DD7C; --ink: #4A3A12; --paper: #FBF3E2; --pumpkin: #D9772B; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: 'Fraunces', Georgia, serif; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.ui { position: fixed; left: 0; right: 0; padding: 16px max(16px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; pointer-events: none; }
.ui > * { pointer-events: auto; }
.top { top: env(safe-area-inset-top); }
.bottom { bottom: env(safe-area-inset-bottom); justify-content: center; text-align: center; }
h1 { font-weight: 600; font-size: clamp(1.3rem, 4.5vw, 1.9rem); margin: 0; letter-spacing: -.01em; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
a, .hint { font-style: italic; font-size: 1rem; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 14; }
a { color: var(--ink); text-decoration: none; background: var(--paper); border-radius: 999px; padding: 3px 14px; box-shadow: 0 2px 0 rgba(74,58,18,.18); white-space: nowrap; }
a:hover { background: #fff; }
a:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 3px; }
.hint { margin: 0; opacity: .8; transition: opacity .6s; }
.links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
#load { position: fixed; inset: 0; display: grid; place-items: center; font-style: italic; pointer-events: none; transition: opacity .5s; }
.ready #load { opacity: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./3d/vendor/three.module.min.js", "three/addons/": "./3d/vendor/addons/" } }
</script>
</head>
<body>
<canvas id="c" aria-label="A 3D model of an orange tabby cat with yellow stars on its coat, crouched to pounce on a ball of yarn. Drag to turn it around."></canvas>
<header class="ui top">
  <h1>The yarn chaser</h1>
  <nav class="links"><a href="./">&larr; scrapbook</a><a href="3d/cat.glb" download="sophie-cat.glb">save .glb</a></nav>
</header>
<footer class="ui bottom"><p class="hint" id="hint">drag to look around &middot; tap the yarn</p></footer>
<div id="load">winding the yarn&hellip;</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('c');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#D4DD7C');
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const TARGET = new THREE.Vector3(0.55, 1.25, 0);
const VIEW = new THREE.Vector3(5.2, 4.4, 8.6);          // the angle of the drawing: from the front, a little above

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true; controls.enablePan = false;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.autoRotate = !calm; controls.autoRotateSpeed = 0.7;
controls.addEventListener('start', () => { controls.autoRotate = false; document.getElementById('hint').style.opacity = 0; });

// flat, hand-drawn lighting: three paint tones and a coloured outline, like the illustration
// flat, hand-drawn shading: the painted colours as they are, one soft shadow tone, and a coloured outline
const LIGHT = new THREE.Vector3(0.35, 0.85, 0.4).normalize();
const toon = (src) => new THREE.ShaderMaterial({
  uniforms: { map: { value: src.map || null }, tint: { value: src.map ? new THREE.Color(1, 1, 1) : src.color.clone() }, light: { value: LIGHT } },
  defines: src.map ? { USE_PAINT: 1 } : {},
  vertexShader: 'varying vec3 vN; varying vec2 vUv; void main(){ vN = normalize(normalMatrix * normal); vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D map; uniform vec3 tint; uniform vec3 light; varying vec3 vN; varying vec2 vUv;
    void main(){
      vec3 c = tint;
      #ifdef USE_PAINT
      c *= texture2D(map, vUv).rgb;
      #endif
      float lit = smoothstep(-0.42, -0.30, dot(normalize(vN), normalize((viewMatrix * vec4(light, 0.0)).xyz)));
      gl_FragColor = vec4(c * mix(vec3(0.86, 0.74, 0.66), vec3(1.0), lit), 1.0);
      #include <colorspace_fragment>
    }`,
});
const outlineMat = (colour, width) => new THREE.ShaderMaterial({
  side: THREE.BackSide, uniforms: { c: { value: new THREE.Color(colour) }, w: { value: width } },
  vertexShader: 'uniform float w; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * w, 1.0); }',
  fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}',
});
const OUTLINE = { Cat: ['#CF7A34', 0.016], Star: ['#EDBE3A', 0.011], StarShadow: ['#EDBE3A', 0.008], YarnBall: ['#C56E2C', 0.014], YarnThread: ['#C56E2C', 0.006] };

// ground: a soft round patch, a shadow, and the scattered flowers from the drawing
const disc = (r, colour, y) => { const m = new THREE.Mesh(new THREE.CircleGeometry(r, 96), new THREE.MeshBasicMaterial({ color: colour })); m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m; };
disc(4.6, '#C9D55F', -0.012).position.x = 0.5;
const paintTex = (size, draw) => { const cv = document.createElement('canvas'); cv.width = cv.height = size; draw(cv.getContext('2d'), size); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const sticker = (tex, x, z, size, rot = 0, y = 0.004) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })); m.rotation.set(-Math.PI / 2, 0, rot); m.position.set(x, y, z); scene.add(m); return m; };
const shadowTex = paintTex(256, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(120,138,40,.55)'); r.addColorStop(.55, 'rgba(120,138,40,.32)'); r.addColorStop(1, 'rgba(120,138,40,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });
const catShadow = sticker(shadowTex, 0.1, 0, 3.6, 0, 0.001); catShadow.scale.set(1.15, 0.62, 1);
const yarnShadow = sticker(shadowTex, 2.62, -0.06, 1.0, 0, 0.002);
const flowerTex = paintTex(256, (g, s) => {
  g.translate(s / 2, s / 2);
  const petals = (len, wid, colour) => { g.fillStyle = colour; for (let i = 0; i < 5; i++) { g.save(); g.rotate(i * Math.PI * 2 / 5 + 0.3); g.beginPath(); g.ellipse(0, -len * .62, wid, len * .5, 0, 0, Math.PI * 2); g.fill(); g.restore(); } };
  petals(s * .44, s * .15, '#FFFDF2'); g.fillStyle = '#FFFDF2'; g.beginPath(); g.arc(0, 0, s * .12, 0, 7); g.fill();
  petals(s * .30, s * .055, '#F8B81E');
});
const dotTex = paintTex(128, (g, s) => { g.fillStyle = '#FFFDF2'; g.beginPath(); g.ellipse(s / 2, s / 2, s * .46, s * .42, .4, 0, 7); g.fill(); g.fillStyle = '#F8B81E'; g.beginPath(); g.ellipse(s / 2, s / 2, s * .2, s * .17, .4, 0, 7); g.fill(); });
const pebbleTex = paintTex(128, (g, s) => { g.fillStyle = '#FFFDF2'; g.beginPath(); g.ellipse(s / 2, s / 2, s * .46, s * .40, -.5, 0, 7); g.fill(); g.fillStyle = '#AEC43A'; g.beginPath(); g.ellipse(s / 2, s / 2, s * .28, s * .22, -.5, 0, 7); g.fill(); });
[[-2.4, 1.6, .62, 0], [1.2, 2.3, .56, 1], [3.4, 1.5, .5, 2], [-1.2, -2.2, .6, .5], [2.1, -2.3, .54, 1.4], [-3.3, -0.6, .5, 2.2], [3.9, -1.0, .46, .9]].forEach(([x, z, s, r]) => sticker(flowerTex, x, z, s, r));
[[-0.6, 2.4, .3], [2.6, 2.7, .26], [-3.0, 0.7, .28], [0.5, -2.6, .3], [3.2, -2.2, .24], [-2.3, -1.8, .26], [4.2, 0.4, .26], [-1.6, 3.0, .22]].forEach(([x, z, s]) => sticker(dotTex, x, z, s));
[[0.4, 3.2, .36], [-3.7, 1.9, .3], [1.3, -3.3, .34], [-2.9, -2.6, .28], [4.3, 2.0, .3]].forEach(([x, z, s], i) => sticker(pebbleTex, x, z, s, i));

let cat, ball, ballHome, hop = -1;
new GLTFLoader().load('3d/cat.glb', (gltf) => {
  const model = gltf.scene; scene.add(model);
  const meshes = []; model.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    let named = o; while (named && !OUTLINE[named.name]) named = named.parent;
    const [colour, width] = OUTLINE[named?.name] || OUTLINE.Cat;
    if (o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    o.material = toon(o.material);
    o.add(new THREE.Mesh(o.geometry, outlineMat(colour, width)));
    if (named?.name === 'YarnBall') ball = named;
  }
  cat = model; ballHome = ball.position.clone();
  document.body.classList.add('ready');
}, undefined, () => { document.getElementById('load').textContent = 'The model could not be loaded.'; });

// tap the yarn: it hops and rolls
const ray = new THREE.Raycaster(); let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!ball || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  if (ray.intersectObject(ball, true).length && hop < 0) hop = 0;
});

function fit() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const dist = VIEW.length() * Math.max(1, 1.12 / camera.aspect);     // step back on tall phones so the whole cat fits
  if (!fit.done) { camera.position.copy(TARGET).addScaledVector(VIEW.clone().normalize(), dist); fit.done = true; }
  controls.minDistance = 5; controls.maxDistance = dist * 1.6;
}
addEventListener('resize', fit); fit();

const clock = new THREE.Clock(); let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  if (ball) {
    let x = 0, y = 0;
    if (!calm) x = Math.sin(t * 1.3) * 0.035;                       // the yarn trembles under the paw
    if (hop >= 0) {
      hop += dt / 1.1; const k = Math.min(hop, 1);
      y = Math.abs(Math.sin(k * Math.PI * 2)) * 0.5 * (1 - k); x += Math.sin(k * Math.PI) * 0.35;
      if (hop >= 1) hop = -1;
    }
    ball.position.set(ballHome.x + x, ballHome.y + y, ballHome.z);
    ball.rotation.z = -x / 0.31;
    yarnShadow.position.x = ball.position.x; yarnShadow.material.opacity = 1 - y;
    if (!calm) cat.scale.y = 1 + Math.sin(t * 1.9) * 0.008;         // breathing
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
